<ui-page-state
  [loading]="loader.loading()"
  loadingLabel="Loading your team…"
  [skeletonCards]="2"
  [error]="loader.initialError()"
  (retry)="reloadAll()"
/>
@if (board(); as view) {
<div class="event-stack team-home">
  <event-team-hero
    [board]="view"
    [roomLine]="roomLine()"
    [cluesLine]="cluesLine()"
  />
  @if (loader.refreshError(); as error) {
  <event-refresh-error [error]="error" (retry)="reloadAll()" />
  }
  <event-team-room-workspace [board]="view" (changed)="reloadAll()" />
  <section aria-labelledby="team-rooms-heading">
    <h2 id="team-rooms-heading">Rooms</h2>
    @if (finishedEvidence().length > 0) {
    <p class="event-muted">Your answers in finished rooms. Keep the clues for the final.</p>
    }
    <div class="event-grid">
      @for (room of view.rooms; track room.roomId) {
      <event-team-room-card
        [room]="room"
        [activity]="activityOf(view, room.code)"
        [evidence]="finishedEvidenceOf(room.code)"
        [recoverable]="isRecoverable(view, room.code)"
      />
      }
    </div>
  </section>
  <event-team-final-card [board]="view" />
  <event-team-answer-history
    [receipts]="receiptList()"
    [rooms]="view.rooms"
    [error]="receiptsError()"
  />
</div>
}
