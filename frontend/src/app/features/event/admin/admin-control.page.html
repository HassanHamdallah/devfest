<header class="event-page-header">
  <h1>Event control</h1>
  @if (board.data(); as data) {
  <app-control-bar
    [state]="data.state"
    [busy]="actionState.busy()"
    (action)="request($event)"
  />
  }
</header>

<ui-page-state
  [loading]="board.loading()"
  loadingLabel="Loading the event board…"
  [skeletonCards]="4"
  [error]="board.blockingError()"
  (retry)="board.retry()"
/>

@if (board.data(); as data) {
<div class="event-stack">
  @if (board.staleError(); as error) {
  <ui-alert variant="warning"
    >Showing the last loaded board. {{ error }}</ui-alert
  >
  }
  <app-round-timer-panel
    [state]="data.state"
    [rooms]="data.rooms"
    [startWarnings]="data.startWarnings"
    [startBlockers]="data.startBlockers"
    [busy]="actionState.busy()"
    (action)="request($event)"
  />
  <app-action-status [state]="actionState" />
  <app-room-cards
    [rooms]="data.rooms"
    [busy]="actionState.busy()"
    [roomError]="roomError()"
    (action)="request($event)"
  />
  <app-alerts-list [alerts]="data.alerts" />
  <app-rotation-table [board]="data" />
  <app-ranking-panel
    [rows]="data.ranking"
    [published]="data.state.resultsPublished"
    [busy]="actionState.busy()"
    (action)="request($event)"
  />
  <app-round-settings
    [state]="data.state"
    [busy]="actionState.busy()"
    (action)="request($event)"
  />
</div>
}

<ui-confirm-dialog
  [open]="confirmOpen()"
  [title]="confirmation().title"
  [message]="confirmation().message"
  [confirmVariant]="confirmation().variant"
  [confirmLabel]="confirmation().confirmLabel ?? 'Confirm'"
  [busy]="actionState.busy()"
  (confirmed)="confirm()"
  (cancelled)="cancel()"
/>
