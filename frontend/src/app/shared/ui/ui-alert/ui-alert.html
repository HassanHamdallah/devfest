<div class="ui-alert__content">
  <ng-content />
</div>
@if (dismissible()) {
<button
  type="button"
  class="ui-alert__dismiss"
  (click)="handleDismiss()"
  aria-label="Dismiss"
>
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
    <path
      fill="currentColor"
      d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6z"
    />
  </svg>
</button>
}
