<div class="ui-textarea-field">
  <label class="ui-textarea-field__label" [attr.for]="textareaId">
    {{ label() }} @if (required()) {
    <span class="ui-textarea-field__required" aria-hidden="true">*</span>
    }
  </label>

  <textarea
    #textareaEl
    class="ui-textarea-field__control"
    [id]="textareaId"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [required]="required()"
    [disabled]="isDisabled()"
    [value]="value()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedById()"
    [attr.aria-autocomplete]="ariaAutocomplete()"
    [attr.aria-expanded]="ariaExpanded()"
    [attr.aria-controls]="ariaControls()"
    [attr.aria-activedescendant]="ariaActiveDescendant()"
    (input)="handleInput($event)"
    (blur)="handleBlur()"
    (click)="handleClick($event)"
    (keyup)="handleKeyup($event)"
    (keydown)="handleKeydown($event)"
  ></textarea>

  @if (error(); as message) {
  <p class="ui-textarea-field__error" [id]="textareaId + '-error'">
    {{ message }}
  </p>
  } @else if (hint(); as message) {
  <p class="ui-textarea-field__hint" [id]="textareaId + '-hint'">
    {{ message }}
  </p>
  }
</div>
