@if (loading()) {
<div class="ui-page-state__loading" role="status">
  <span class="event-sr-only">{{ loadingLabel() }}</span>
  <ui-skeleton [cards]="skeletonCards()" [lines]="3" />
</div>
} @else if (error(); as text) {
<div class="ui-page-state__error">
  <ui-alert variant="error">{{ text }}</ui-alert>
  <ui-button variant="secondary" (click)="retry.emit()">Try again</ui-button>
</div>
} @else if (empty()) {
<ui-empty-state [title]="emptyTitle()" [description]="emptyDescription()" />
}
