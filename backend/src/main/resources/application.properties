spring.application.name=devfest
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8081}
spring.datasource.url=${DEVFEST_DB_URL:jdbc:postgresql://127.0.0.1:55432/devfest}
spring.datasource.username=${DEVFEST_DB_USER:devfest}
spring.datasource.password=${DEVFEST_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.connection-timeout=5000
spring.jdbc.template.query-timeout=5s
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
app.jwt-secret=${DEVFEST_JWT_SECRET}
# Orders each team's AI quiz questions, options and snippets; required outside development (AiRoomShuffleSecret).
app.quiz-shuffle-secret=${DEVFEST_QUIZ_SHUFFLE_SECRET:}
app.origins=${DEVFEST_ORIGINS:http://localhost:4201}
app.bootstrap-email=${DEVFEST_ADMIN_EMAIL:}
app.bootstrap-password=${DEVFEST_ADMIN_PASSWORD:}
app.judge-url=${JUDGE0_URL:}
app.judge-key=${JUDGE0_KEY:}
app.judge-auth-header=${JUDGE0_AUTH_HEADER:X-Auth-Token}
app.judge-host=${JUDGE0_RAPIDAPI_HOST:}
app.worker-enabled=${DEVFEST_WORKER_ENABLED:true}
app.worker-concurrency=${DEVFEST_WORKERS:4}
app.seed=${DEVFEST_SEED:false}
app.event-seed-password=${DEVFEST_EVENT_SEED_PASSWORD:}
app.event-seed-teams=${DEVFEST_EVENT_SEED_TEAMS:16}
logging.level.org.springframework.boot.security.autoconfigure=ERROR

app.development=${DEVFEST_DEVELOPMENT:false}
app.judge-security-reviewed=${JUDGE0_SECURITY_REVIEWED:false}
# Live event stream: heartbeat and session re-check interval per open stream (tests use a shorter one).
app.event-stream.heartbeat=15s
