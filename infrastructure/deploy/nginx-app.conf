# Shared by nginx-site.conf (HTTPS) and nginx-site-http-only.conf (plain HTTP). setup-server.sh installs it as
# /etc/nginx/snippets/devfest-app.conf; both site files pull it in with "include" inside their main server block.
# It holds everything that is the same on HTTP and HTTPS: security headers (except HSTS), gzip, the API proxy
# locations and the frontend. Never put HSTS or anything certificate-related here.

    root /srv/devfest/frontend/current;

    # Default body limit. Each upload/import endpoint that needs more has its own location below.
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # 'wasm-unsafe-eval' lets the in-browser terminal (v86) compile its WebAssembly; it does not allow eval().
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Never serve hidden files (.env, .git, ...).
    location ~ /\. {
        return 404;
    }

    # ---- API: body sizes (most specific first; regex locations are tried in this order) -------------------------------

    # Linux room "server package" ZIP. Spring accepts a 25 MB file inside a 26 MB request (spring.servlet.multipart.*),
    # so nginx must allow 26 MB. Slow venue Wi-Fi: give the upload two minutes.
    location ~ ^/api/v1/event/rooms/[0-9]+/terminal-bundle$ {
        client_max_body_size 26m;
        client_body_timeout 120s;
        limit_req zone=devfest burst=400 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Terminal text files: up to 2 MB each, 5 MB per room.
    location ~ ^/api/v1/event/rooms/[0-9]+/terminal-files {
        client_max_body_size 5m;
        limit_req zone=devfest burst=400 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Content JSON files sent as the raw request body: the Sentinel/AI room mission import (the sample file is 28 KB)
    # and the Crypto final content import (2 KB). The backend sets no limit of its own, so nginx's 2 MB is the cap.
    location ~ ^/api/v1/event/(rooms/[0-9]+/mission/import|admin/final/content)$ {
        client_max_body_size 2m;
        limit_req zone=devfest burst=400 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Live revision push (Server-Sent Events): never buffer, keep the connection open up to the 30-minute stream.
    location = /api/v1/event/stream {
        access_log /var/log/nginx/devfest-stream.log devfest_stream;
        limit_req zone=devfest burst=400 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 35m;
        proxy_send_timeout 35m;
    }

    # Every other API call: JSON bodies are small (the largest field in the code is 64 KB), so the 1 MB default stays.
    location /api/ {
        limit_req zone=devfest burst=400 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ---- Frontend ---------------------------------------------------------------------------------------------------

    # In-browser terminal: the emulator and Linux image never change under one ?v= version, so they are cached for a
    # year. The binaries are stored as .gz and inflated by the page; they must go out as they are (no gzip again,
    # no Content-Encoding), so only libv86.js is compressed here (gzip_types above). devfest-tools.tgz (the extra tools
    # of rooms with a server package) is such a file too: the page hands it to the guest as it is.
    location ^~ /terminal/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Code editor files keep their names between versions: cache for a week only.
    location ^~ /monaco/ {
        expires 7d;
        try_files $uri =404;
    }

    # The page shell and runtime config must never be served stale after a deploy; hashed assets may be cached for ever.
    location = /index.html { expires -1; }
    location = /config.js  { expires -1; }
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
