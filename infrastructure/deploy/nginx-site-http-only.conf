# Temporary site used BEFORE the HTTPS certificate exists (setup-server.sh installs it, then nginx-site.conf replaces it).
# It only answers the Let's Encrypt domain check on port 80. REPLACE_DOMAIN is filled in by setup-server.sh.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name REPLACE_DOMAIN;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        default_type text/plain;
        return 200 "DevFest server is being set up. HTTPS is not enabled yet.\n";
    }
}
