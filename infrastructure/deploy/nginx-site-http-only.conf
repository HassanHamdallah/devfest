# DevFest site over plain HTTP (port 80 only). Used for the first deploy on a bare server IP, and for a domain whose
# certificate does not exist yet. setup-server.sh installs it as /etc/nginx/sites-available/devfest, replaces REPLACE_HOST
# with the server IP (or domain) and installs nginx-app.conf as /etc/nginx/snippets/devfest-app.conf.
#
# No HSTS here on purpose: a browser that has seen HSTS on this host refuses plain HTTP afterwards. There is no
# redirect to HTTPS and no port 443. When a domain and certificate exist, setup-server.sh installs nginx-site.conf instead
# (docs/DEPLOYMENT.md, "Switching to HTTPS").

limit_req_zone $binary_remote_addr zone=devfest:10m rate=200r/s;
limit_req_status 429;

# The live stream's ticket travels in the query string; this log format leaves the query string out.
log_format devfest_stream '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
    # default_server: with a bare IP every request is for this site whatever Host header it carries.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name REPLACE_HOST;
    server_tokens off;

    # Folder certbot uses to prove we own the domain (only needed once a domain exists). "^~" is required: without it
    # the "never serve hidden files" rule in the shared part (location ~ /\.) would win and answer 404.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Over HTTP/1.1 a browser keeps at most 6 connections to this address and the live stream holds one of them:
    # use one tab per person.
    include /etc/nginx/snippets/devfest-app.conf;
}
