# DevFest production site over HTTPS. Installed as /etc/nginx/sites-available/devfest (symlinked in sites-enabled) by
# setup-server.sh, which replaces REPLACE_HOST with the domain and installs nginx-app.conf as /etc/nginx/snippets/devfest-app.conf.
# Serves the frontend from /srv/devfest/frontend/current (a symlink deploy.sh moves) and proxies /api/ to the backend on
# 127.0.0.1:8081. Needs the certificate from: certbot certonly --webroot -w /var/www/certbot -d REPLACE_HOST

limit_req_zone $binary_remote_addr zone=devfest:10m rate=200r/s;
limit_req_status 429;

# The live stream's ticket travels in the query string; this log format leaves the query string out.
log_format devfest_stream '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

# Anything that is not our domain (scans by IP address) is dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# HTTP -> HTTPS (and the folder certbot uses to prove we own the domain).
server {
    listen 80;
    listen [::]:80;
    server_name REPLACE_HOST;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://REPLACE_HOST$request_uri;
    }
}

server {
    # HTTP/2 matters: the live stream holds one connection open and HTTP/1.1 browsers allow only 6 per site.
    # The separate "http2 on;" directive needs nginx 1.25.1 or newer (Ubuntu 24.04 and 26.04 ship it); the old
    # "listen ... http2" form is deprecated and prints a warning.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name REPLACE_HOST;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/REPLACE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/REPLACE_HOST/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS for one day: raise it (e.g. 31536000) once the site has run fine for a while.
    # (HTTPS only: never send this over plain HTTP, see nginx-site-http-only.conf.)
    add_header Strict-Transport-Security "max-age=86400" always;

    # Everything else (headers, gzip, API proxy, frontend) is shared with the HTTP-only site.
    include /etc/nginx/snippets/devfest-app.conf;
}
